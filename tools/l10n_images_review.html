<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duyệt ảnh Boom KR · VN</title>
<style>
:root{color-scheme:dark;--bg:#111820;--surface:#1c2733;--line:#344657;--muted:#adbdcc;--accent:#80dcbb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef4f9;font:15px system-ui,sans-serif}header{padding:24px 4vw 14px;border-bottom:1px solid var(--line)}h1{font-size:26px;margin:0 0 6px}p{color:var(--muted);line-height:1.5}button,input,select,textarea,.button{font:inherit;border:1px solid var(--line);border-radius:7px;background:#243444;color:inherit;padding:9px}button,.button{cursor:pointer}button:hover,.button:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}a{color:var(--accent)}.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.filters{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 4vw;box-shadow:0 3px 9px #0005}#search{min-width:240px;flex:1}#counts{margin:10px 0;color:var(--accent)}#notice{color:#ffd38a;min-height:20px;margin:10px 0 0}main{padding:0 4vw 30px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}.card h2{font-size:14px;overflow-wrap:anywhere;font-weight:550;margin:9px 0}.pack{font-size:12px;color:var(--accent)}.muted{font-size:12px;color:var(--muted)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.well{height:190px;display:flex;align-items:center;justify-content:center;overflow:hidden;background-color:#b8b8b8;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;border-radius:5px;color:#222;text-align:center}.dark .well{background-color:#334052;background-image:none}.well img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated}.well span{padding:12px;font-size:12px}.caption{margin:5px 0;font-weight:650;font-size:12px}.card select,.card textarea{width:100%;margin-top:10px}.card textarea{resize:vertical;min-height:44px}.pager{display:flex;align-items:center;justify-content:center;gap:15px;padding:18px}.legend{font-size:13px}dialog{width:96vw;max-width:1600px;max-height:95vh;background:var(--surface);color:inherit;border:1px solid var(--line);border-radius:10px;padding:20px}dialog::backdrop{background:#000b}.detailhead{justify-content:space-between;margin-bottom:12px}#detailtitle{max-width:80%;overflow-wrap:anywhere}#detail .well{height:60vh;overflow:auto;display:block;text-align:left}#detail .well img{max-width:none;max-height:none;object-fit:initial}#detail .well.fit img{max-width:100%;max-height:100%;object-fit:contain}#detail .well.fit{display:flex;align-items:center;justify-content:center}#detail select{max-width:100%}#detail p{margin:6px 0}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}.pair{gap:5px}header,.filters,main{padding-left:12px;padding-right:12px}.well{height:150px}#detail .pair{grid-template-columns:1fr}#detail .well{height:40vh}}
</style>
<header><h1>Duyệt ảnh Boom · KR / VN</h1><p>So sánh ảnh Hàn và ảnh Việt cùng tên. Mở chi tiết để coi đủ ảnh con trước khi xác nhận.</p>
<div class="bar"><button id="download">Xuất kết quả CSV</button><label class="button">Nhập kết quả CSV<input id="import" type="file" accept=".csv" hidden></label><button id="background">Đổi nền ảnh</button></div>
<p class="legend">“Khác bản VN” chỉ là gợi ý có ảnh thay thế, chưa xác nhận đã dịch. Ảnh có thể không chứa chữ.</p><div id="notice" role="status"></div></header>
<section class="filters"><div class="bar"><input id="search" placeholder="Tìm tên ảnh, nút, màn hình…" aria-label="Tìm tài nguyên"><select id="pack" aria-label="Pack"><option value="">Tất cả pack</option></select><select id="relation" aria-label="Đối chiếu"><option value="">Mọi đối chiếu</option><option value="diff_bytes">Khác bản VN</option><option value="same_bytes">Giống bản VN</option><option value="no">Không có bản VN</option></select><select id="filter" aria-label="Trạng thái"><option value="">Tất cả trạng thái</option></select></div><div id="counts"></div></section>
<main><nav class="pager"><button id="prev">← Trước</button><span id="page"></span><button id="next">Sau →</button></nav><div class="grid" id="grid"></div><nav class="pager"><button id="prev2">← Trước</button><span id="page2"></span><button id="next2">Sau →</button></nav></main>
<dialog id="detail"><div class="bar detailhead"><strong id="detailtitle"></strong><button id="close">Đóng ✕</button></div><div class="bar"><label><input id="fit" type="checkbox" checked> Vừa khung (bỏ chọn để coi kích thước gốc)</label><label>Phóng <select id="zoom"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div><p id="detailinfo"></p><div class="pair" id="detailimages"></div></dialog>
<script>
'use strict';
const DATA=/*__GALLERY_DATA__*/[];
const LABELS={pending:'Chưa duyệt',translated:'Đã có tiếng Việt',needs_translation:'Cần dịch',no_text:'Không có chữ',check:'Cần kiểm tra thêm'};
const REL={diff_bytes:'Khác bản VN',same_bytes:'Giống bản VN',no:'Không có bản VN'};
const KEY='boom-image-review-v1'; let decisions={},page=0,current=null,storageOK=true;const SIZE=36;
const $=id=>document.getElementById(id);const key=r=>r.pack+'\t'+r.entry;
const h=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function decision(r){return decisions[key(r)]||{status:'pending',notes:''}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(decisions));$('notice').textContent='Đã lưu trong trình duyệt. Xuất CSV để giữ bản sao và nhập vào dự án.'}catch(e){storageOK=false;$('notice').textContent='Trình duyệt không lưu được tại chỗ. Hãy xuất CSV trước khi đóng trang.'}}
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');for(const r of DATA){const d=saved[key(r)];if(d&&Object.hasOwn(LABELS,d.status))decisions[key(r)]={status:d.status,notes:String(d.notes||'')}}}catch(e){storageOK=false}
const byId=new Map(DATA.map(r=>[r.id,r]));
function filtered(){const q=$('search').value.toLocaleLowerCase('vi');return DATA.filter(r=>(!q||(r.entry+' '+r.pack).toLocaleLowerCase('vi').includes(q))&&(!$('pack').value||r.pack===$('pack').value)&&(!$('relation').value||r.vn_same_name===$('relation').value)&&(!$('filter').value||decision(r).status===$('filter').value))}
function stats(){const c=Object.fromEntries(Object.keys(LABELS).map(k=>[k,0]));for(const r of DATA)c[decision(r).status]++;$('counts').textContent=DATA.length.toLocaleString('vi')+' tài nguyên · '+Object.entries(c).map(([k,v])=>LABELS[k]+': '+v.toLocaleString('vi')).join(' · ')}
function thumb(side,label){if(!side)return '<div><div class="caption">'+label+'</div><div class="well"><span>Không có ảnh cùng tên</span></div></div>';const imgs=side.images||[];return '<div><div class="caption">'+label+' · '+imgs.length+' ảnh con</div><div class="well">'+(imgs.length?'<img loading="lazy" src="'+h(imgs[0].thumb)+'" alt="'+label+'">':'<span>'+h(side.error||'Không có ảnh con hiển thị')+'</span>')+'</div></div>'}
function render(){const rows=filtered();page=Math.min(page,Math.max(0,Math.ceil(rows.length/SIZE)-1));const pages=Math.max(1,Math.ceil(rows.length/SIZE));const text='Trang '+(page+1)+' / '+pages+' · '+rows.length+' kết quả';$('page').textContent=$('page2').textContent=text;for(const n of ['prev','prev2'])$(n).disabled=page===0;for(const n of ['next','next2'])$(n).disabled=page>=pages-1;const visible=rows.slice(page*SIZE,(page+1)*SIZE);
$('grid').innerHTML=visible.map(r=>{const d=decision(r);return '<article class="card" data-id="'+r.id+'"><span class="pack">'+h(r.pack)+' · '+h(REL[r.vn_same_name])+'</span><h2>'+h(r.entry)+'</h2><div class="pair">'+thumb(r.kr,'KR')+thumb(r.vn,'VN')+'</div><p class="muted">'+h(r.kind)+' · '+h(r.dims||'')+'</p><button class="open">Coi đủ ảnh / phóng lớn</button><select class="state" aria-label="Xác nhận '+h(r.entry)+'">'+Object.entries(LABELS).map(([v,t])=>'<option value="'+v+'"'+(v===d.status?' selected':'')+'>'+t+'</option>').join('')+'</select><textarea class="note" rows="1" placeholder="Ghi chú (chữ cần dịch, chọn ảnh VN…)" aria-label="Ghi chú">'+h(d.notes)+'</textarea></article>'}).join('')||'<div class="empty">Không có ảnh khớp bộ lọc.</div>';stats()}
for(const p of [...new Set(DATA.map(r=>r.pack))].sort())$('pack').add(new Option(p,p));for(const [k,v]of Object.entries(LABELS))$('filter').add(new Option(v,k));
for(const id of ['pack','relation','filter'])$(id).onchange=()=>{page=0;render()};let delay;$('search').oninput=()=>{clearTimeout(delay);delay=setTimeout(()=>{page=0;render()},120)};
for(const id of ['prev','prev2'])$(id).onclick=()=>{page--;render();scrollTo(0,0)};for(const id of ['next','next2'])$(id).onclick=()=>{page++;render();scrollTo(0,0)};
$('background').onclick=()=>document.body.classList.toggle('dark');
$('grid').onclick=e=>{if(e.target.closest('.open'))openDetail(byId.get(Number(e.target.closest('.card').dataset.id)))};
$('grid').onchange=e=>{if(!e.target.classList.contains('state'))return;const r=byId.get(Number(e.target.closest('.card').dataset.id));decisions[key(r)]={...decision(r),status:e.target.value};persist();stats()};
$('grid').oninput=e=>{if(!e.target.classList.contains('note'))return;const r=byId.get(Number(e.target.closest('.card').dataset.id));decisions[key(r)]={...decision(r),notes:e.target.value};persist()};
function openDetail(r){current=r;$('detailtitle').textContent=r.pack+' / '+r.entry;$('detailinfo').textContent=REL[r.vn_same_name]+' · Ảnh con có thể là một dải nhiều trạng thái của nút.';$('detailimages').innerHTML=['kr','vn'].map(s=>{const side=r[s],imgs=side?.images||[];return '<section><h3>'+s.toUpperCase()+'</h3>'+(imgs.length?'<select data-side="'+s+'" aria-label="Ảnh con '+s+'">'+imgs.map((im,j)=>'<option value="'+j+'">Ảnh '+im.index+' · '+im.width+'×'+im.height+'</option>').join('')+'</select><p><a class="original" target="_blank" rel="noopener">Mở PNG gốc ↗</a></p><div class="well fit"><img alt="'+s.toUpperCase()+'"></div>':'<p>'+h(side?.error||'Không có ảnh cùng tên')+'</p>')+'</section>'}).join('');for(const s of ['kr','vn'])updateDetailImage(s,0);if(!$('detail').open)$('detail').showModal()}
function updateDetailImage(s,j){const im=current[s]?.images[j];if(!im)return;const sel=$('detailimages').querySelector('[data-side="'+s+'"]'),section=sel.closest('section'),img=section.querySelector('img');img.src=im.full;img.dataset.width=im.width;section.querySelector('.original').href=im.full;zoomDetail()}
$('detailimages').onchange=e=>{if(e.target.dataset.side)updateDetailImage(e.target.dataset.side,Number(e.target.value))};
function zoomDetail(){for(const img of $('detailimages').querySelectorAll('img')){img.closest('.well').classList.toggle('fit',$('fit').checked);img.style.width=$('fit').checked?'':(Number(img.dataset.width)*Number($('zoom').value))+'px'}}
$('fit').onchange=zoomDetail;$('zoom').onchange=()=>{$('fit').checked=false;zoomDetail()};$('close').onclick=()=>$('detail').close();
function csvCell(s){return '"'+String(s).replace(/"/g,'""')+'"'}
function csvText(){return '\ufeff'+[['pack','entry','status','notes'],...DATA.map(r=>[r.pack,r.entry,decision(r).status,decision(r).notes])].map(row=>row.map(csvCell).join(',')).join('\r\n')+'\r\n'}
$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([csvText()],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='images_review.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);$('notice').textContent='Đã xuất toàn bộ kết quả. Giữ file images_review.csv để dùng lại hoặc gởi nhập vào dự án.'};
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;text=text.replace(/^\ufeff/,'');for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\r'||c==='\n')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('Dấu nháy CSV chưa đóng');if(cell||row.length){row.push(cell);rows.push(row)}return rows}
$('import').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const rows=parseCSV(await f.text());const header=rows.shift();const pos=['pack','entry','status','notes'].map(x=>header.indexOf(x));if(pos.some(i=>i<0))throw Error('Thiếu cột pack, entry, status hoặc notes');const valid=new Set(DATA.map(key)),next={};for(const r of rows){const k=r[pos[0]]+'\t'+r[pos[1]],status=r[pos[2]];if(!valid.has(k)||!Object.hasOwn(LABELS,status)||Object.hasOwn(next,k))throw Error('Có tài nguyên lạ, trùng hoặc trạng thái sai');next[k]={status,notes:r[pos[3]]||''}}if(Object.keys(next).length!==DATA.length)throw Error('CSV chưa chứa đủ '+DATA.length+' tài nguyên');decisions=next;persist();render()}catch(err){$('notice').textContent='Chưa nhập: '+err.message}finally{e.target.value=''}};
render();if(!storageOK)$('notice').textContent='Không thể khôi phục dữ liệu tại chỗ. Dùng Nhập/Xuất CSV để lưu kết quả.';
</script></html>
